    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(29);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W30"
    state_class: measurement
