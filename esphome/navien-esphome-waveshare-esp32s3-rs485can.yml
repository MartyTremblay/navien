# This configuration file is for a Waveshare ESP32-S3-RS485-CAN industrial control board.
#
# Board: https://www.waveshare.com/wiki/ESP32-S3-RS485-CAN
#
# RS485 terminal block pinout on this board:
#   TX = GPIO17, RX = GPIO18, direction/"talk" pin = GPIO21
# The onboard RS485 transceiver does NOT auto-switch direction, flow_control_pin
# must be set below or transmit/receive will not work correctly.
#
# Confirm your Navien delivers +12V (give or take a volt) on the wire you intend
# to power this board from, and match A/B polarity to the RS485 screw terminals.
#
# See [the 240 wiring docs](docs/240.md) for more info

substitutions:
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  platform: esp32
  board: esp32-s3-devkitc-1
  friendly_name: Navien
  project_name: Navien.Waveshare-ESP32S3-RS485CAN
  project_version: "0.0.0.1"

esp32:
  framework:
    type: esp-idf

esphome:
  platformio_options:
    board_build.flash_mode: dio # use Dual IO (dio) instead of Quad IO (qio) to prevent boot loop after flashing

packages:
  navien: !include navien-base.yml
  transport: !include navien-transport-wifi.yml
  sensors: !include navien-sensors-metric.yml
  water_heater: !include navien-water-heater.yml

uart:
  flow_control_pin: ${flow_control_pin}

# No web UI on this device: Home Assistant uses the native API, and an
# unauthenticated web server lets anything on the LAN change settings.
web_server: !remove

# Navien reports temperatures in 0.5 °C steps. On this NHB-H the DHW entities
# show the indirect tank (setpoint and tank temperature), so use the tank range
# from Navien's NHB-H manual (DHW Tank Set Temp 30-65 C, p. 107);
# the boiler clamps anything it doesn't accept.
climate:
  - id: !extend navien_climate
    visual:
      min_temperature: 40
      max_temperature: 65
      # The tank setpoint takes whole degrees only (54.5 C was ignored, 55 C
      # applied); the tank temperature is still reported in 0.5 C steps.
      temperature_step:
        target_temperature: 1
        current_temperature: 0.5

water_heater:
  - id: !extend navien_water_heater
    min_temperature: 40
    max_temperature: 65
    visual:
      target_temperature_step: 1

logger:
  level: INFO
  baud_rate: 0 #disable logging over uart

dashboard_import:
  package_import_url: github://MartyTremblay/navien/esphome/navien-esphome-waveshare-esp32s3-rs485can.yml@personal-waveshare-deploy
  import_full_config: false

button:
  - platform: navien
    name: ${friendly_name} Hot Button

# Space-heating supply setpoint over RS485 (upstream #81, verified on NCB-H).
# Testing on NHB-H. Shows the unit's reported value, so a rejected command
# snaps back. With outdoor reset active, the boiler's curve overrides this.
number:
  - platform: template
    name: "${friendly_name} SH Setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 40       # NHB default SH supply range 40-82 C
    max_value: 82
    step: 0.5
    mode: box
    update_interval: 2s
    lambda: |-
      if (!id(navien_main).has_data()) return NAN;
      return id(navien_main).get_sh_set_temp_c();
    set_action:
      - lambda: |-
          id(navien_main).send_sh_set_temp_cmd(x);

  # Existing DHW setpoint command, as a control for the transport check: if
  # this applies but SH Setpoint doesn't, commands reach the unit and the
  # NHB-H just ignores the SH command. Range from the NHB manual (40-82 C).
  - platform: template
    name: "${friendly_name} DHW Setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 40
    max_value: 82
    step: 0.5
    mode: box
    update_interval: 2s
    lambda: |-
      if (!id(navien_main).has_data()) return NAN;
      return id(navien_dhw_set_temperature).state;
    set_action:
      - lambda: |-
          id(navien_main).send_dhw_set_temp_cmd(x);

# Candidate fields from unknown packet bytes (NHB-110H, 2026-10-06 snapshot).
# Values matched the unit's panel / manual defaults once; unconfirmed until
# watched over time. Offsets are packet offsets as numbered in navien_proto.h.
sensor:
  # water[39] = 0xA4 = 82 C, the panel's DHW Boiler Set Temp (likely)
  - platform: template
    name: "${friendly_name} DHW Boiler Set Temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(39);
      return v < 0 ? NAN : v / 2.0f;
  # gas[44] = 82 C, manual default supply absolute max (likely)
  - platform: template
    name: "${friendly_name} SH Supply Max Temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).gas_byte(44);
      return v < 0 ? NAN : v / 2.0f;
  # gas[45] = 40 C, manual default supply absolute min (likely)
  - platform: template
    name: "${friendly_name} SH Supply Min Temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).gas_byte(45);
      return v < 0 ? NAN : v / 2.0f;
  # gas[42] = 65 C, manual default return absolute max (likely)
  - platform: template
    name: "${friendly_name} SH Return Max Temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).gas_byte(42);
      return v < 0 ? NAN : v / 2.0f;
  # gas[43] = 30 C, manual default return absolute min (likely)
  - platform: template
    name: "${friendly_name} SH Return Min Temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).gas_byte(43);
      return v < 0 ? NAN : v / 2.0f;
  # water[34..35] little-endian = 11690: a runtime in minutes, or two separate bytes?
  - platform: template
    name: "${friendly_name} Unknown W34-35"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int lo = id(navien_main).water_byte(34), hi = id(navien_main).water_byte(35);
      return (lo < 0 || hi < 0) ? NAN : (float) (lo | (hi << 8));
  # water[34] = 0xAA (170; 85 C if a temperature)
  - platform: template
    name: "${friendly_name} Unknown W34"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(34);
      return v < 0 ? NAN : (float) v;
  # water[35] = 0x2D (45)
  - platform: template
    name: "${friendly_name} Unknown W35"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(35);
      return v < 0 ? NAN : (float) v;
  # water[21] = 0x64 (100): SH max heat capacity %?
  - platform: template
    name: "${friendly_name} Unknown W21"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(21);
      return v < 0 ? NAN : (float) v;
  # Candidate bytes for the still-undocumented range of the WATER_DATA packet
  # (community navien_proto.h has no name for any of these), added 2026-10-19
  # while hunting for a water-pressure field: Navien's own NHB-H manual
  # documents a real Water Pressure Sensor (system pressure display, a "Water
  # Press (psi)" diagnostic item, and fault codes E302/E352/E353), but no
  # community decode or prior pass through this file has identified which
  # byte it is. These are diagnostic-only, meant to be watched through a
  # heating cycle and then trimmed back down to whichever one (if any) rises
  # smoothly with supply temperature; the rest should be deleted once this
  # is resolved, not kept around permanently.
  - platform: template
    name: "${friendly_name} Unknown W19"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(19);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W20"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(20);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W22"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(22);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W23"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(23);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W26"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(26);
      return v < 0 ? NAN : (float) v;
  # Community decode labels 28/29 and 30/31 as "Counter A"/"Counter B" lo/hi
  # pairs, "pinned to 255 on NCB-H models" (a different Navien model than
  # this NHB-H, so still worth checking, just a weaker candidate than a
  # fully blank byte).
  - platform: template
    name: "${friendly_name} Unknown W28"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      int v = id(navien_main).water_byte(28);
      return v < 0 ? NAN : (float) v;
  - platform: template
    name: "${friendly_name} Unknown W29"
    state_class: measurement
